        Skip to main content
    </a>


    <!-- Header -->

        <div class="container">

            <h1>Chekuri Vijaya Lakshmi</h1>

            <p>Information Technology Student</p>


            <!-- Navigation -->
            <nav aria-label="Main navigation">

                </ul>

            </nav>

        </div>

    </header>


    <!-- Main -->
    <main id="main-content" role="main">

        <section aria-labelledby="contact-heading">

            <div class="container">

                <h2 id="contact-heading">
                    Contact Me
                </h2>

                <p>
                    Please fill in the form below to
                    send me a message.
                </p>


                <!-- Accessible contact form -->
                <form action="#" method="post">

                    <fieldset>

                        <legend>
                            Contact Information
                        </legend>


                        <!-- Name -->
                        <div class="form-group">

                            <label for="name">
                                Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                autocomplete="name"
                                required>

                        </div>


                        <!-- Email -->
                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                autocomplete="email"
                                required>

                        </div>


                        <!-- Message -->
                        <div class="form-group">

                            <label for="message">
                                Message
                            </label>

                            <textarea
                                id="message"
                                name="message"
                                rows="6"
                                required></textarea>

                        </div>


                        <!-- Submit -->
                        <button type="submit">
                            Send Message
                        </button>

                    </fieldset>

                </form>

            </div>

        </section>

    </main>
